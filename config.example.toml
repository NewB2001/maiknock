# 麦麦敲门 MaiKnock v0.4.0 配置示例
# 复制本文件为 config.toml 后按需修改；config.toml 不会进入版本控制。

[plugin]
enabled = true                 # 总开关（由宿主读取：关掉后整个插件不加载）
config_version = "0.4.0"       # 与 plugin.py 的 VERSION 保持一致，不要手改

[proactive]
enabled = true                    # 是否开启「麦麦主动找你聊天」
silence_threshold_minutes = 60    # 冷场多久之后可能找你：最早（分钟）
silence_threshold_max_minutes = 90  # 最晚（分钟）；与「最早」相同则退回固定时刻
daily_max = 5                     # 一天内最多主动找你几次

# 免打扰时段：麦麦在这些时段内不会主动找你。可添加多段。
# 开始==结束 = 该段无效；开始>结束 = 跨天（如 22:00~06:00）。
[[proactive."免打扰时段"]]
"开始" = "01:00"
"结束" = "08:00"

[style_guard]
enabled = true        # 小说体格式：【】内心 →（动作/环境）→ 说话，对所有聊天生效
"内心想法" = true      # 开=带【】内心；关=不写内心（⚠️ 关掉反而更耗 token，详见 README）
"动作环境" = true      # 开=带（）动作/环境描写；关=不写

[reply_length]
"回复篇幅" = "简短（60-200字）"   # 四选一：简短（60-200字）/ 适中（100-400字）/ 详细（150-600字）/ 自由
# 「自由」= 不限制字数、麦麦自己决定。档位自带范围、选不到「最大<最小」，下限恒 >= 60
# 大致范围不是硬截断，字数只算说出口的话，【】（）不算

# ── 麦麦聊天室（多 Bot 同台一个虚拟群）────────────────────────────────────
# ⚠️ 出厂状态全部关闭 ⇒ 装上这个插件但不动这几项，行为跟没装聊天室一模一样。
[chatroom]
enabled = false               # 聊天室的开关
data_source = "mock"          # mock=演示假数据（出厂）；real=真递话真回复。出问题切回 mock 就是总后门
ledger_path = ""              # 共享账本(SQLite)的绝对路径。★所有参与的 Bot 必须配成同一个★
api_key = ""                  # 本 Bot 自己的消息服务 Key（bot_config.toml 的 [maim_message] 那一条）。每个 Bot 填自己的

[chatroom.splitter]
enabled = false               # 聊天室的回复整条一个气泡（只影响聊天室，不动 QQ/微信真群聊的分段）

[chatroom.delivery]
enabled = false               # 把台词递进虚拟群（关掉=界面照常但麦麦不接话）

[chatroom.collect]
enabled = false               # 把 Bot 的回复收回来显示到时间线

# 说明：扫描间隔、回读参数、重生上限等内部机制项不出现在 WebUI 配置页，
# 代码内置同值默认；旧 config.toml 里残留的键会被忽略、不报错。
