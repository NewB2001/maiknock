    div.appendChild(jump);

    return div;
  }

  // 确认气泡挂在对应分隔线的后面
  function renderScope(scope, keepScroll) {
    if (scope === "private") { renderPrivate(keepScroll); } else { renderTimeline(keepScroll); }
    renderTruncateBubble(scope);
  }

  function renderTruncateBubble(scope) {
    var host = scope === "private" ? $("private-timeline") : $("timeline");
    if (!host) { return; }
    var old = host.querySelector(".truncate-confirm");
    if (old) { old.remove(); }
    var target = state.truncateTarget;
    if (!target || target.scope !== scope) { return; }

    var segments = segmentsOf(scope);
    if (target.index >= segments.length) { state.truncateTarget = null; return; }
    var summary = truncateSummary(scope, target.index);

    var card = document.createElement("div");
    card.className = "truncate-confirm";
    var text = document.createElement("div");
    text.className = "tc-text";
    text.textContent = summary.text;
    card.appendChild(text);

    var actions = document.createElement("div");
    actions.className = "tc-actions";
    var ok = document.createElement("button");
    ok.type = "button";
    ok.className = "maibot-button maibot-button-danger";
    ok.textContent = "确认截断";
    ok.onclick = function () { confirmTruncate(scope, target.index); };
    actions.appendChild(ok);
    var cancel = document.createElement("button");
    cancel.type = "button";
    cancel.className = "maibot-button";
    cancel.textContent = "取消";
    // 走 cancelTruncate()，它会**保住滚动位置**。
    // 之前这里直接调 renderScope(scope)（少了 keepScroll），
    // 结果点一下「取消」时间线就被甩到最底端 —— 看着像"点了就跳走"。
    cancel.onclick = function () { cancelTruncate(); };
    actions.appendChild(cancel);
    card.appendChild(actions);

    // 插到第 index 段的分隔线后面
    var wraps = host.querySelectorAll(".segment");
    if (wraps[target.index]) {
      wraps[target.index].insertBefore(card, wraps[target.index].children[1] || null);
    } else {
      host.appendChild(card);
    }
    // 气泡必须看得见：它挂在那一条分隔线下面，
    // 那一条要是落在视口外（或贴着视口下沿），用户就只会觉得"点了没反应"。
    // 只在看不见的时候才动滚动 —— 本来就看得见就一点都不动。
    revealCard(card, host);
  }

  // 把确认气泡挪进时间线的可视区（尽量少挪）
  function revealCard(card, host) {
    var hostRect = host.getBoundingClientRect();
    var rect = card.getBoundingClientRect();
    if (rect.top >= hostRect.top && rect.bottom <= hostRect.bottom) { return; }
    var delta = rect.top < hostRect.top
      ? rect.top - hostRect.top - 8
      : rect.bottom - hostRect.bottom + 8;
    host.scrollTop += delta;
  }

  // 注：旧版这里还有个 beatDivider(seq)，它调用的 jumpToBeat 从来没定义过，
  // 而且整段代码没有任何地方调用（真正在用的是 segmentDivider）——
  // 属于死代码，已删，免得以后有人误调它直接炸 ReferenceError。

  // 气泡行。merged = true 表示「同一个角色连着发的又一条」——
  // 这时不再重复画头像和名字/时间，只留一个空头像位保持左右对齐。
  function messageRow(message, merged) {
    var member = memberById(message.speaker_member_id);
    var isNarrator = message.speaker_kind === "narrator" || message.kind === "narrator";
    var isBot = isNarrator ? false : (member ? member.kind === "bot" : message.speaker_kind === "bot");
    var isMine = !isBot && !isNarrator;

    var row = document.createElement("div");
    row.className = "msg kind-" + (message.kind || "line")
      + (isMine ? " is-mine" : "")
      + (merged ? " is-merged" : "");
    row.dataset.speaker = message.speaker_member_id || "";

    var avatar = document.createElement("div");
    avatar.className = "avatar" + (isBot ? " is-bot" : "");
    if (merged) {
      // 合并进来的这条不重复画头像，留个空位撑住宽度就行
      avatar.classList.add("is-ghost");
    } else if (isNarrator) {
      avatar.textContent = (state.narrator && state.narrator.avatar) || "📖";
      avatar.title = "剧情旁白（固定身份，不可被扮演）";
    } else {
      // 头像可能是上传来的图片（data URI），也可能只是 emoji。
      // 统一走 fillAvatar：图片坏了就退回首字圆牌，
      // 绝不会把整串 data URI 当文字写进圆牌里（那会把时间线撑出横向滚动条）。
      fillAvatar(avatar, member && member.avatar, (message.speaker_name || "?").slice(0, 1));
    }
    row.appendChild(avatar);

    var main = document.createElement("div");
    main.className = "msg-main";

    if (!merged) {
      var head = document.createElement("div");
      head.className = "msg-head";
      var name = document.createElement("span");
      name.className = "name";
      name.textContent = message.speaker_name;
      head.appendChild(name);
      var tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = isNarrator ? "剧情旁白" : (isBot ? "麦麦 Bot" : "我饰演");
      head.appendChild(tag);
      var time = document.createElement("span");
      time.className = "time";
      time.textContent = message.time || "";
      head.appendChild(time);
      main.appendChild(head);
    }

    var bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = message.content;
    main.appendChild(bubble);

    row.appendChild(main);
    return row;
  }

  // 往一段里追加一条消息：若上一条是同一个人，就把这条并成「不带头像」的那条。
  function appendMessageRow(container, message) {
    var speaker = message.speaker_member_id || "";
    var merged = false;
    var kids = container.children;
    for (var i = kids.length - 1; i >= 0; i -= 1) {
      if (kids[i].classList && kids[i].classList.contains("msg")) {
        merged = !!speaker && kids[i].dataset.speaker === speaker;
        break;
      }
    }
    container.appendChild(messageRow(message, merged));
  }

  function scrollToBottom(box) {
    box.scrollTop = box.scrollHeight;
  }

  function renderPrivate(keepScroll) {
    var box = $("private-timeline");
    var saved = keepScroll ? box.scrollTop : null;
    box.innerHTML = "";
    // 标题按「对方 × 我方角色」拼，跟有没有线程无关。
    // 对方从受管 Bot / 成员池里找（私聊列表的数据源），不再依赖 state.peers。
    var peer = null;
    (state.managedBots || []).some(function (item) {
      if (item.peer_member_id === state.currentPeerId) {
        peer = { member_id: item.peer_member_id, display_name: item.peer_name || item.bot_name };
        return true;
      }
      return false;
    });
    if (!peer) { peer = memberById(state.currentPeerId); }
    var myName = "";
    state.myRoles.forEach(function (item) {
      if (item.member_id === state.privateSpeaker) { myName = item.display_name; }
    });
    $("private-title").textContent = peer
      ? ((myName || "我") + " ⇄ " + peer.display_name)
      : "私聊";
    // 右栏那行小字直说「只发给谁」，别用「只递给对方一人」这种绕口的说法
    var peerNote = $("private-peer-note");
    if (peerNote) {
      peerNote.textContent = peer ? ("仅" + peer.display_name + "可见") : "只发给对方一人";
    }

    var segments = segmentsOf("private");
    if (!segments.length) {
      var empty2 = document.createElement("div");
      empty2.className = "empty";
      empty2.textContent = peer
        ? "和「" + peer.display_name + "」还没有聊天记录。"
        : "还没有私聊线程。";
      box.appendChild(empty2);
      return;
    }
    segments.forEach(function (segment, index) {
      box.appendChild(segmentElement(segment, index, "private"));
    });
    if (saved === null) { scrollToBottom(box); } else { box.scrollTop = saved; }
  }

  // 「最近和当前操作角色聊过」的时间：取该线程最后一条消息的 time（HH:MM），
  // 没聊过返回空串 —— 排序时空串沉底，再按首字母兜底。
  function lastChatTime(peerMemberId) {
    var myId = state.privateSpeaker;
    if (!myId) { return ""; }
    var latest = "";
    (state.privateThreads || []).forEach(function (thread) {
      if (thread.peer_member_id !== peerMemberId || thread.my_member_id !== myId) { return; }
      var msgs = [];
      (thread.segments || []).forEach(function (seg) {
        (seg.messages || []).forEach(function (msg) { msgs.push(msg); });
      });
      if (!msgs.length) { return; }
      var t = msgs[msgs.length - 1].time || "";
      if (t > latest) { latest = t; }
    });
    return latest;
  }

  // 手动刷新「私聊对象」：重新向宿主拉一次 bootstrap，只更新私聊相关的数据。
  // 页面本身不轮询，这是唯一的主动拉取入口。
  async function refreshPrivatePeers() {
    var btn = $("refresh-peers-btn");
    if (btn) { btn.disabled = true; }
    // 记住当前选中，刷新后尽量保住（对方若已不在名单里才回退到第一个）
    var keepPeerId = state.currentPeerId;
    var keepSpeakerId = state.privateSpeaker;
    try {
      var data = await window.maibot.query("bootstrap");
      if (data.member_pool) { state.memberPool = data.member_pool; }
      if (data.my_roles) { state.myRoles = data.my_roles; }
      if (data.managed_bots) { state.managedBots = data.managed_bots; }
      if (data.private_threads) {
        state.privateThreads = data.private_threads;
        state.privateTimeline = {}; // 线程快照变了，旧的重绘缓存作废
      }
      // 当前对方：还在名单里就保留，否则回退到第一个
      var ids = (state.managedBots || []).map(function (b) { return b.peer_member_id; });
      state.currentPeerId = ids.indexOf(keepPeerId) >= 0 ? keepPeerId : (ids.length ? ids[0] : null);
      // 当前操作角色：还在角色列表里就保留，否则回退到第一个
      var roleIds = (state.myRoles || []).map(function (m) { return m.member_id; });
      state.privateSpeaker = roleIds.indexOf(keepSpeakerId) >= 0
        ? keepSpeakerId : (roleIds.length ? roleIds[0] : "");

      renderPrivatePeers();
      renderPrivateSpeaker();
      renderPrivate();
      renderPrivateTurnState();
      clearPrivateError();
    } catch (error) {
      showPrivateError("刷新失败：" + (error && error.message ? error.message : error));
    } finally {
      if (btn) { btn.disabled = false; }
    }
  }

  // 私聊对象 = 宿主的**全部受管 Bot**（默认全展示，不提供增删）。
  // 排序：最近和「当前操作的角色」聊过的排上面；没聊过按名字首字母。
  function renderPrivatePeers() {
    var box = $("private-peers");
    box.innerHTML = "";
    var bots = (state.managedBots || []).map(function (managed) {
      // 补全展示字段：受管名单只有 bot_id / peer_member_id / peer_name
      var full = memberById(managed.peer_member_id) || {};
      return {
        member_id: managed.peer_member_id,
        display_name: managed.peer_name || full.display_name || managed.bot_name || "未命名 Bot",
        bot_name: managed.bot_name || "",
        avatar: full.avatar || "🤖",
        status: full.status || "",
        last: lastChatTime(managed.peer_member_id)
      };
    });
    bots.sort(function (a, b) {
      if (a.last !== b.last) {
        // 有聊过的排前面；都是 HH:MM，字典序即时间序
        if (!a.last) { return 1; }
        if (!b.last) { return -1; }
        return a.last < b.last ? 1 : -1; // 越晚越靠前
      }
      return a.display_name.localeCompare(b.display_name, "zh-CN");
    });

    $("private-peer-count").textContent = bots.length + " 个";
    var currentPeer = state.currentPeerId;
    bots.forEach(function (peer) {
      var li = document.createElement("li");
      li.className = "is-clickable";
      if (peer.member_id === currentPeer) { li.className += " is-current"; }
      li.title = "点一下切到这个私聊";

      var avatar = document.createElement("div");
      avatar.className = "avatar is-bot";
      fillAvatar(avatar, peer.avatar, peer.display_name.slice(0, 1));
      avatar.title = "接入状态：" + (STATUS_TEXT[peer.status] || peer.status);
      li.appendChild(avatar);

      var text = document.createElement("div");
      text.className = "member-text";
      var name = document.createElement("div");
      name.className = "member-name";
      name.textContent = peer.display_name;
      var sub = document.createElement("div");
      sub.className = "member-sub";
      sub.textContent = peer.last ? ("最近聊于 " + peer.last) : (peer.bot_name || "私聊对象");
      text.appendChild(name);
      text.appendChild(sub);
      li.appendChild(text);

      li.onclick = function () { switchPeer(peer.member_id); };
      box.appendChild(li);
    });
  }

  /* ── 提交一幕（群聊）──────────────────────────────────── */

  // 「开演」「发送」在内容为空时直接禁用（不点就没提示）
  function updateSubmitButtons() {
    var hasScript = state.scriptRows.some(function (row) { return (row.text || "").trim(); });
    var beatButton = $("submit-beat");
    if (beatButton) { beatButton.disabled = !hasScript; }
    var text = $("private-text");
    var sendButton = $("submit-private");
    if (sendButton) { sendButton.disabled = !text || !text.value.trim(); }
  }

  function collectLines(rows) {
    return rows
      .filter(function (row) { return (row.text || "").trim(); })
      .map(function (row) {
        return {
          speaker_member_id: row.member_id,
          speaker: row.speaker,
          text: row.text.trim()
        };
      });
  }

  async function submitBeat() {
    if (state.turn) {
      showError("上一幕还在演，先等它演完（或点「停止本轮」）。");
      return;
    }
    var room = currentRoom();
    if (!room) { showError("先选一个房间。"); return; }

    var lines = collectLines(state.scriptRows);
    if (!lines.length) { showError("这一幕还没有台词。"); return; }
    var unassigned = lines.filter(function (line) { return !line.speaker_member_id; });
    if (unassigned.length) {
      showError("有 " + unassigned.length + " 行还没指定角色，请在每行左边的下拉框里选一个。");
      return;
    }

    var button = $("submit-beat");
    button.disabled = true;
    try {
      var result = await window.maibot.action("submit_beat", {
        room_id: room.room_id,
        lines: lines,
        speakers: state.speakerOrder.slice(),
        auto_reply: state.autoReply
      });
      var failure = businessError(result);
      if (failure) { showError(failure); return; }
      clearError();
      updateSubmitButtons();
      await playBeat(room, result);
    } catch (error) {
      showError("提交失败：" + error.message);
    } finally {
      button.disabled = false;
    }
  }

  async function playBeat(room, plan) {
    var token = ++state.turnToken;
    var box = $("timeline");

    // ⚠️ **真模式**（real data_source）：台词已写进共享账本，
    //    回复由各 Bot **异步**产生（不像假数据那样能提前算好节奏）
    //    ⇒ 不做本地假动画，改为**轮询账本时间线**，回复到了就停。
    //    （旧逻辑拿不到 plan.plan 会误报「没有能接话的 Bot」且界面不刷新）
    if (plan && plan.stage === "real") {
      await pollRealBeat(room, plan, token);
      return;
    }

    // 这一段 = 我方这次提交的多条台词 + 紧随其后的一轮 Bot 回复
    var segments = segmentsOf("group");
    var segment = {
      seq: nextSeq(segments),
      kind: "normal",
      voided: false,
      messages: []
    };
    insertSegment(segments, segment);
    var index = segments.indexOf(segment);
    state.stageNote = null;
    renderStageBars();

    renderTimeline();
    var wraps = $("timeline").querySelectorAll(".segment");
    var wrap = wraps[index] || null;

    (plan.lines || []).forEach(function (line) {
      var message = {
        message_id: "live_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7),
        speaker_member_id: line.member_id,
        speaker_name: line.display_name,
        speaker_kind: line.kind,
        kind: "line",
        content: line.text,
        time: nowClock()
      };
      segment.messages.push(message);
      if (wrap && wrap.isConnected) { appendMessageRow(wrap, message); }
    });
    scrollToBottom(box);

    var turn = {
      room_id: room.room_id,
      beat_seq: segment.seq,
      strategy: plan.strategy,
      strategy_label: plan.strategy_label,
      seed: plan.seed,
      silenced: plan.silenced || [],
      ordered: (plan.plan || []).map(function (item) { return item.display_name; }),
      started_at: Date.now(),
      index: 0
    };
    state.turn = turn;
    $("stop-turn").hidden = false;
    renderTurnState();
    state.elapsedTimer = setInterval(updateElapsed, 250);

    if (!state.autoReply || !plan.plan || !plan.plan.length) {
      finishTurn(token, "这个房间里没有能接话的 Bot。");
      return;
    }

    for (var i = 0; i < plan.plan.length; i += 1) {
      if (token !== state.turnToken) { return; }
      var item = plan.plan[i];
      turn.index = i;
      var waiter = waitingRow(item.display_name);
      if (wrap && wrap.isConnected) { wrap.appendChild(waiter); }
      scrollToBottom(box);

      var deadline = Date.now() + item.delay_seconds * 1000 / state.speed;
      await waitUntil(deadline, token, "group");
      if (token !== state.turnToken) { return; }

      if (waiter.parentNode) { waiter.parentNode.removeChild(waiter); }
      // item.silenced 为真 = 这一轮她没开口：时间线上什么都不留（FR-09）。
      // 沉默名单由插件在计划里一次给出（turn.silenced），这里不要重复追加。
      if (!item.silenced) {
        (item.lines || []).forEach(function (line) {
          var message = {
            message_id: "live_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7),
            speaker_member_id: item.member_id,
            speaker_name: item.display_name,
            speaker_kind: item.kind,
            kind: line.kind,
            content: line.content,
            time: nowClock()
          };
          segment.messages.push(message);
          if (wrap && wrap.isConnected) { appendMessageRow(wrap, message); }
        });
      }
      renderTurnState();
      updateElapsed();
      scrollToBottom(box);
    }

    finishTurn(token, null);
  }

  // ⚠️ 真模式：轮询账本时间线，直到本轮这段出现 Bot 回复（或超时）。
  //    台词已经在账本里（后端 append_segment 写过），所以这里不再本地插入，
  //    直接以账本为准刷新 —— 避免「本地一份 + 账本一份」重复显示。
  async function pollRealBeat(room, plan, token) {
    var targetRoom = room.room_id;
    state.turn = {
      room_id: targetRoom,
      beat_seq: 0,
      strategy: plan.strategy,
      strategy_label: plan.formation_label ? ("调度：" + plan.formation_label) : "等待接话",
      seed: plan.seed,
      silenced: [],
      ordered: [],
      started_at: Date.now(),
      index: 0,
      real: true
    };
    $("stop-turn").hidden = false;
    renderTurnState("已递话，等麦麦接话……");
    state.elapsedTimer = setInterval(updateElapsed, 250);
    await loadRoomTimeline(targetRoom);
    var speed = Math.max(state.speed || 1, 0.1);
    var deadline = Date.now() + 160000 / speed;
    while (token === state.turnToken && Date.now() < deadline) {
      await new Promise(function (resolve) { setTimeout(resolve, 3000); });
      if (token !== state.turnToken) { return; }
      await loadRoomTimeline(targetRoom);
      var segs = state.timeline[targetRoom] || [];
      var last = null;
      for (var i = segs.length - 1; i >= 0; i -= 1) {
        if (!segs[i].voided) { last = segs[i]; break; }
      }
      if (last) {
        var hasReply = (last.messages || []).some(function (m) { return m.kind === "reply"; });
        if (hasReply) { break; }
      }
    }
    finishTurn(token, token === state.turnToken ? "本轮结束。" : null);
  }

  /* ── 提交（私聊）──────────────────────────────────────── */

  async function submitPrivate() {
    if (state.privateTurn) {
      showPrivateError("上一句还在等回复，先等它回（或点「停止本轮」）。");
      return;
    }
    var thread = currentThread();
    if (!thread) { showPrivateError("还没有私聊对象。"); return; }

    var text = ($("private-text").value || "").trim();
    if (!text) { showPrivateError("还没写要说什么。"); return; }
    var speakerId = $("private-speaker").value;
    if (!speakerId) { showPrivateError("先在左边「我的角色」里加一个角色。"); return; }
    var speaker = memberById(speakerId);

    var button = $("submit-private");
    button.disabled = true;
    try {
      var result = await window.maibot.action("submit_private", {
        peer_member_id: state.currentPeerId,
        lines: [{
          speaker_member_id: speakerId,
          speaker: speaker ? speaker.display_name : "",
          text: text
        }]
      });
      var failure = businessError(result);
      if (failure) { showPrivateError(failure); return; }
      clearPrivateError();
      $("private-text").value = "";
      updateSubmitButtons();
      await playPrivate(thread, result);
    } catch (error) {
      showPrivateError("发送失败：" + error.message);
    } finally {
      button.disabled = false;
    }
  }

  async function playPrivate(thread, plan) {
    var token = ++state.privateTurnToken;
    var box = $("private-timeline");

    var segments = segmentsOf("private");
    var segment = {
      seq: nextSeq(segments),
      kind: "normal",
      voided: false,
      messages: []
    };
    insertSegment(segments, segment);
    var index = segments.indexOf(segment);
    state.stageNote = null;
    renderStageBars();

    renderPrivate();
    var wraps = $("private-timeline").querySelectorAll(".segment");
    var wrap = wraps[index] || null;

    (plan.lines || []).forEach(function (line) {
      var message = {
        message_id: "pv_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7),
        speaker_member_id: line.member_id,
        speaker_name: line.display_name,
        speaker_kind: line.kind,
        kind: "line",
        content: line.text,
        time: nowClock()
      };
      segment.messages.push(message);
      if (wrap && wrap.isConnected) { appendMessageRow(wrap, message); }
    });
    scrollToBottom(box);

    var turn = {
      thread_id: thread.thread_id,
      peer_name: plan.peer_name,
      seed: plan.seed,
      ordered: (plan.plan || []).map(function (item) { return item.display_name; }),
      started_at: Date.now()
    };
    state.privateTurn = turn;
    $("stop-private-turn").hidden = false;
    renderPrivateTurnState();
    state.privateElapsedTimer = setInterval(updatePrivateElapsed, 250);

    for (var i = 0; i < (plan.plan || []).length; i += 1) {
      if (token !== state.privateTurnToken) { return; }
      var item = plan.plan[i];
      var waiter = waitingRow(item.display_name);
      if (wrap && wrap.isConnected) { wrap.appendChild(waiter); }
      scrollToBottom(box);

      var deadline = Date.now() + item.delay_seconds * 1000 / state.speed;
      await waitUntil(deadline, token, "private");
      if (token !== state.privateTurnToken) { return; }

      if (waiter.parentNode) { waiter.parentNode.removeChild(waiter); }
      (item.lines || []).forEach(function (line) {
        var message = {
          message_id: "pv_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7),
          speaker_member_id: item.member_id,
          speaker_name: item.display_name,
          speaker_kind: item.kind,
          kind: line.kind,
          content: line.content,
          time: nowClock()
        };
        segment.messages.push(message);
        if (wrap && wrap.isConnected) { appendMessageRow(wrap, message); }
      });
      renderPrivateTurnState();
      updatePrivateElapsed();
      scrollToBottom(box);
    }

    finishPrivateTurn(token, null);
  }

  function waitingRow(name) {
    var row = document.createElement("div");
    row.className = "msg kind-waiting";

    var avatar = document.createElement("div");
    avatar.className = "avatar is-pending";
    avatar.textContent = "…";
    row.appendChild(avatar);

    var main = document.createElement("div");
    main.className = "msg-main";

    var head = document.createElement("div");
    head.className = "msg-head";
    var label = document.createElement("span");
    label.className = "name";
    label.textContent = name;
    head.appendChild(label);
    var tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = "麦麦 Bot";
    head.appendChild(tag);
    main.appendChild(head);

    var bubble = document.createElement("div");
    bubble.className = "bubble dots";
    bubble.textContent = "等待" + name + "接话";
    main.appendChild(bubble);

    row.appendChild(main);
    return row;
  }

  // 用墙上时钟算截止时间，而不是「数 tick」：
  // 标签页切到后台时浏览器会把定时器降频到 1Hz，数 tick 会让节奏严重走样；
  // 按时间戳算，切回来时会直接补上落后的那一段。
  // scope 决定用哪个 token 判定「这一轮被取消了」——
  // 群聊用 turnToken，私聊用 privateTurnToken，两个不能混。
  function waitUntil(deadline, token, scope) {
    return new Promise(function (resolve) {
      var timer = setInterval(function () {
        var alive = scope === "private"
          ? token === state.privateTurnToken
          : token === state.turnToken;
        if (!alive) { clearInterval(timer); resolve(); return; }
        if (Date.now() >= deadline) { clearInterval(timer); resolve(); }
      }, 250);
    });
  }

  function finishTurn(token, note) {
    if (token !== state.turnToken) { return; }
    if (state.turn) {
      state.turn.final_elapsed = (Date.now() - state.turn.started_at) * state.speed / 1000;
      state.lastTurn = state.turn;
    }
    state.turn = null;
    if (state.elapsedTimer) { clearInterval(state.elapsedTimer); state.elapsedTimer = null; }
    $("stop-turn").hidden = true;
    renderTurnState(note || "本轮结束。");
  }

  function stopTurn() {
    if (!state.turn) { return; }
    state.turnToken += 1;
    if (state.elapsedTimer) { clearInterval(state.elapsedTimer); state.elapsedTimer = null; }
    var box = $("timeline");
    var waiting = box.querySelectorAll(".kind-waiting");
    for (var i = 0; i < waiting.length; i += 1) { waiting[i].remove(); }
    if (state.turn) { state.lastTurn = state.turn; }
    state.turn = null;
    $("stop-turn").hidden = true;
    renderTurnState("本轮已手动停止。");
  }

  function renderTurnState(note) {
    var box = $("turnstate");
    var turn = state.turn || state.lastTurn;
    if (!turn && !note) { box.hidden = true; state.elapsedNode = null; return; }
    box.hidden = false;
    box.innerHTML = "";
    state.elapsedNode = null;
    if (turn) {
      addState(box, "策略", turn.strategy_label);
      addState(box, "seed", turn.seed);
      addState(box, "顺序", turn.ordered.join(" → ") || "—");
      state.elapsedNode = addState(box, "已等待",
        (turn.final_elapsed !== undefined ? turn.final_elapsed : 0).toFixed(1) + "s");
      if (turn.silenced && turn.silenced.length) {
        addState(box, "沉默（不进时间线）", turn.silenced.join("、"));
      }
    }
    if (note) { addState(box, "说明", note); }
  }

  function updateElapsed() {
    if (!state.elapsedNode || !state.turn) { return; }
    var scaled = (Date.now() - state.turn.started_at) * state.speed / 1000;
    state.elapsedNode.textContent = scaled.toFixed(1) + "s";
  }

  function finishPrivateTurn(token, note) {
    if (token !== state.privateTurnToken) { return; }
    if (state.privateTurn) {
      state.privateTurn.final_elapsed = (Date.now() - state.privateTurn.started_at) * state.speed / 1000;
      state.privateLastTurn = state.privateTurn;
    }
    state.privateTurn = null;
    if (state.privateElapsedTimer) { clearInterval(state.privateElapsedTimer); state.privateElapsedTimer = null; }
    $("stop-private-turn").hidden = true;
    renderPrivateTurnState(note || "本轮结束。");
    renderPrivatePeers(); // 刚聊过，把对方排到最上面
  }

  function stopPrivateTurn() {
    if (!state.privateTurn) { return; }
    state.privateTurnToken += 1;
    if (state.privateElapsedTimer) { clearInterval(state.privateElapsedTimer); state.privateElapsedTimer = null; }
    var box = $("private-timeline");
    var waiting = box.querySelectorAll(".kind-waiting");
    for (var i = 0; i < waiting.length; i += 1) { waiting[i].remove(); }
    if (state.privateTurn) { state.privateLastTurn = state.privateTurn; }
    state.privateTurn = null;
    $("stop-private-turn").hidden = true;
    renderPrivateTurnState("本轮已手动停止。");
  }

  function renderPrivateTurnState(note) {
    var box = $("private-turnstate");
    var turn = state.privateTurn || state.privateLastTurn;
    if (!turn && !note) { box.hidden = true; state.privateElapsedNode = null; return; }
    box.hidden = false;
    box.innerHTML = "";
    state.privateElapsedNode = null;
    if (turn) {
      addState(box, "对方", turn.peer_name);
      addState(box, "seed", turn.seed);
      state.privateElapsedNode = addState(box, "已等待",
        (turn.final_elapsed !== undefined ? turn.final_elapsed : 0).toFixed(1) + "s");
    }
    if (note) { addState(box, "说明", note); }
  }

  function updatePrivateElapsed() {
    if (!state.privateElapsedNode || !state.privateTurn) { return; }
    var scaled = (Date.now() - state.privateTurn.started_at) * state.speed / 1000;
    state.privateElapsedNode.textContent = scaled.toFixed(1) + "s";
  }

  function addState(box, key, value) {
    var span = document.createElement("span");
    var strong = document.createElement("b");
    strong.textContent = value;
    span.appendChild(document.createTextNode(key + " "));
    span.appendChild(strong);
    box.appendChild(span);
    return strong;
  }

  /* ── 提示 ─────────────────────────────────────────────── */

  // 系统提示写在**聊天窗口的标题行**（时光机右边），群聊 / 私聊各有一个。
  // 用 classList 只增删状态类，保住 head-notice 这个省略号样式类不被覆盖；
  // 全文始终挂在 title 上，文本再长也只省略显示、hover 能看全。
  function errorBox() {
    return state.currentView === "private" ? $("private-script-error") : $("script-error");
  }

  function setNotice(box, kind, text) {
    if (!box) { return; }
    box.classList.remove("err", "ok");
    box.classList.add("head-notice", kind);
    box.textContent = text;
    box.title = text;
    box.hidden = false;
  }

  function clearNotice(box) {
    if (!box) { return; }
    box.hidden = true;
    box.textContent = "";
    box.title = "";
  }

  function showError(text) {
    setNotice(errorBox(), "err", text);
  }

  function clearError() {
    ["script-error", "private-script-error"].forEach(function (id) { clearNotice($(id)); });
  }

  // 说明性提示（比如「导出还没实现」），跟错误分开放
  function showInfo(text) {
    setNotice($("script-error"), "ok", text);
  }

  function showPrivateError(text) {
    setNotice($("private-script-error"), "err", text);
  }

  /* ── 上游错误（429 限流等）─────────────────────────────────────────
     ⚠️ 宿主的 LLM 报错**界面上本来什么都不显示** ⇒ Bot 就是「沉默」。
     这里把账本里各 Bot 自报的错误显示在**群聊标题行的提示栏**里，
     点一下就消失（并告诉后端「用户看到了」，不再重复提示）。
     ─────────────────────────────────────────────────────────────── */

  function renderErrorNotice() {
    var errs = state.errors || [];
    if (!errs.length) { clearError(); return; }
    var latest = errs[0] || {};
    var text = latest.text || ("上游出错：" + (latest.kind || "未知错误"));
    if (errs.length > 1) {
      text = text + "（另有 " + (errs.length - 1) + " 条同类报错）";
    }
    setNotice(errorBox(), "err", text);
  }

  async function ackErrors() {
    var errs = state.errors || [];
    if (!errs.length) { return; }
    var ids = errs.map(function (e) { return e.report_id; }).filter(Boolean);
    state.errors = [];
    try {
      if (ids.length) {
        await window.maibot.action("shell_ack_errors", { report_ids: ids });
      }
    } catch (error) {
      /* 标记失败不影响使用：提示已经消失了，下次刷新还会再报一次 */
    }
  }

  async function pollErrors() {
    try {
      var data = await window.maibot.query("errors");
      state.errors = (data && data.errors) || [];
      renderErrorNotice();
    } catch (error) {
      /* 轮询失败不打扰用户（可能是插件重载中） */
    }
  }

  function clearPrivateError() {
    clearNotice($("private-script-error"));
  }

  /* ── 危险操作的通用确认层 ────────────────────────────────
     只用于删房间 / 删角色 / 删群员 / 删私聊对象这类不可撤销的操作。
     点【确认删除】才真正执行；取消 / ESC / 点遮罩都只是关掉，什么都不做。
     同一时刻只显示一个，重复调用以最后一次为准。                    */
  var confirmAction = null;

  function closeConfirm() {
    confirmAction = null;
    var overlay = $("confirm-overlay");
    if (overlay) { overlay.hidden = true; }
  }

  function askConfirm(title, detail, onConfirm) {
    var overlay = $("confirm-overlay");
    if (!overlay) { if (onConfirm) { onConfirm(); } return; }
    confirmAction = onConfirm || null;
    $("confirm-title").textContent = title;
    $("confirm-detail").textContent = detail || "这个操作不可撤销。";
    overlay.hidden = false;
    $("confirm-ok").focus();
  }

  function initConfirm() {
    $("confirm-ok").onclick = function () {
      var action = confirmAction;
      closeConfirm();
      if (action) { action(); }
    };
    $("confirm-cancel").onclick = closeConfirm;
    // 只点遮罩本身才算取消，点卡片内部不关
    $("confirm-overlay").onclick = function (event) {
      if (event.target === $("confirm-overlay")) { closeConfirm(); }
    };
    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape" && !$("confirm-overlay").hidden) { closeConfirm(); }
    });
  }

  // 业务失败由插件用 ok=false 返回（不抛异常），这里统一取错误文案
  function businessError(result) {
    if (result && result.ok === false) {
      return result.error || "操作失败";
    }
    return null;
  }

  /* ── 视图切换 ─────────────────────────────────────────── */

  function switchView(view) {
    state.currentView = view;
    var isPrivate = view === "private";
    // ⚠️ **私聊线程懒加载**：bootstrap 一次带全部线程会超过宿主 API 上限（512 KiB）
    if (isPrivate && !(state.privateThreads || []).length) { loadPrivateThreads(); }
    // 换视图时把还开着的确认气泡收掉（两个视图各有一份，别串场）
    state.truncateTarget = null;
    var tabs = document.querySelectorAll(".viewtab");
    for (var i = 0; i < tabs.length; i += 1) {
      tabs[i].classList.toggle("is-active", tabs[i].getAttribute("data-view") === view);
    }
    // 中栏：群聊时间线 / 私聊时间线
    $("stage-view").hidden = isPrivate;
    $("private-view").hidden = !isPrivate;
    // 右栏：两套独立的剧本窗口
    $("composer").hidden = isPrivate;
    $("composer-private").hidden = !isPrivate;
    // 左栏：私聊没有「房间」这回事，只列私聊对象 + 我的角色
    $("panel-rooms").hidden = isPrivate;
    $("panel-members").hidden = isPrivate;
    $("panel-private").hidden = !isPrivate;
    $("panel-my-roles").hidden = !isPrivate;
    if (isPrivate) {
      renderPrivate();
      renderPrivatePeers();
      renderMyRoles();
      renderPrivateSpeaker();
      renderPrivateTurnState();
    }
  }

  /* ── 启动 ─────────────────────────────────────────────── */

  function bindEvents() {
    initConfirm();
    // 群聊/私聊 拨片现在在两个视图的标题栏里各有一份，用事件委托统一处理
    document.addEventListener("click", function (event) {
      var target = event.target.closest(".viewtab");
      if (target) { switchView(target.getAttribute("data-view")); }
    });
    $("room-create-form").onsubmit = createRoom;
    $("room-rename-save").onclick = renameRoom;
    $("room-rename-cancel").onclick = function () { $("rename-row").hidden = true; };
    $("add-line").onclick = function () { addRowTo(state.scriptRows); };
    $("refresh-peers-btn").onclick = refreshPrivatePeers;
    $("private-text").oninput = function () { updateSubmitButtons(); };
    $("private-speaker").onchange = function (event) {
      state.privateSpeaker = event.target.value;
      renderPrivatePeers(); // 按新角色重新排「最近聊过」的顺序
      renderPrivate();
      renderPrivateTurnState();
    };
    $("submit-beat").onclick = submitBeat;
    $("stop-turn").onclick = stopTurn;
    $("time-machine-btn").onclick = function () { toggleTimeMachine("group"); };
    $("time-machine-private-btn").onclick = function () { toggleTimeMachine("private"); };
    $("memory-notice-close").onclick = function () { $("memory-notice").hidden = true; };
    $("submit-private").onclick = submitPrivate;
    $("stop-private-turn").onclick = stopPrivateTurn;
    $("script-error").onclick = function () { clearError(); ackErrors(); };
    $("private-script-error").onclick = clearPrivateError;
  }

  function applyContext(context) {
    if (!context) { return; }
    if (context.theme) {
      document.documentElement.setAttribute("data-theme", context.theme);
    }
  }

  async function boot() {
    bindEvents();
    try {
      var data = await window.maibot.query("bootstrap");
      state.version = data.version || "";
      state.notice = data.notice || "";
      // 真/假模式：real ⇒ 「回到此处」要真的写账本；shell ⇒ 纯前端本地作废
      state.stage = data.stage || "shell";
      state.timing = data.timing || {};
      state.memberPool = data.member_pool || [];
      state.myRoles = data.my_roles || [];
      state.peers = data.peers || [];
      state.managedBots = data.managed_bots || [];
      state.errors = data.errors || [];
      state.narrator = data.narrator || null;
      state.rooms = data.rooms || [];
      state.timeline = data.timeline || {};
      state.privateThreads = data.private_threads || [];
      state.privateTimeline = {};
      state.currentRoomId = state.rooms.length ? state.rooms[0].room_id : null;
      state.currentThreadId = state.privateThreads.length ? state.privateThreads[0].thread_id : null;
      // 当前对方从受管 Bot 名单取（私聊列表的数据源），不再依赖线程顺序
      state.currentPeerId = state.managedBots.length
        ? state.managedBots[0].peer_member_id
        : (state.privateThreads.length ? state.privateThreads[0].peer_member_id : null);

      // 时光机：群聊、私聊各一个面板（共用同一套逻辑）
      state.tmGroup = buildTimeMachine("group", "tm-slot-group");
      state.tmPrivate = buildTimeMachine("private", "tm-slot-private");

      renderRooms();
      renderMembers();
      renderMyRoles();
      renderSpeakerChecks();
      updateTurnHint();
      renderScriptRows();
      renderPrivateSpeaker();
      renderTimeline();
      renderPrivate();
      renderPrivatePeers();
      renderTurnState();
      renderPrivateTurnState();
      renderStageBars();
      updateSubmitButtons();
      renderErrorNotice();
      // 当前房间的时间线按需拉（bootstrap 只带第一个房间）
      if (state.currentRoomId) { loadRoomTimeline(state.currentRoomId); }
      // 私聊线程也懒加载（bootstrap 不带）
      loadPrivateThreads();
      // 轮询上游错误：宿主报错时提示自己冒出来（每 8 秒一次）
      if (state.errorTimer) { clearInterval(state.errorTimer); }
      state.errorTimer = setInterval(pollErrors, 8000);
    } catch (error) {
      showError("读取初始假数据失败：" + error.message);
    }
  }

  window.addEventListener("maibot:context", function (event) { applyContext(event.detail); });

  window.maibot.ready.then(function (context) {
    applyContext(context);
    return boot();
  }).catch(function (error) {
    showError("页面初始化失败：" + (error && error.message ? error.message : error));
  });
})();
</script>
</body>
</html>
